<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

    <title>{% block title %}Lerseth{% endblock %}</title>

    <link rel="stylesheet" href="{{ root }}static/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <nav>
        <div class="logo">
            <a href="{{ root }}index.html" style="color:inherit; text-decoration:none;">LERSETH</a>
        </div>

        <div class="links">
            <a href="{{ root }}index.html">Home</a>
            <a href="{{ root }}work.html">Projects</a>
            <a href="{{ root }}interests.html">Interests</a>
            <a href="{{ root }}index.html#contact">Contact</a>

    </nav>

{% block content %}{% endblock %}

<footer>
    © 2026 Lerseth
</footer>

</body>
</html>
